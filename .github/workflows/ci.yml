# Builds everything with warnings as errors and runs the Core and Desktop tests, including the tests that need the
# Northwind sample and the server tests against SQL Server and MySQL. The FlaUI tests need Windows and are not run here.
name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    services:
      mssql:
        image: mcr.microsoft.com/mssql/server:2022-latest
        env:
          ACCEPT_EULA: "Y"
          MSSQL_SA_PASSWORD: "Forge-Test-42!"
        ports:
          - 1433:1433
        options: >-
          --health-cmd "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P 'Forge-Test-42!' -C -Q 'SELECT 1'"
          --health-interval 10s --health-timeout 5s --health-retries 20
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: forge-test-42
        ports:
          - 3306:3306
        options: >-
          --health-cmd "mysqladmin ping -h 127.0.0.1 -uroot -pforge-test-42"
          --health-interval 10s --health-timeout 5s --health-retries 20

    env:
      DOTNET_NOLOGO: "true"
      DOTNET_CLI_TELEMETRY_OPTOUT: "true"
      # Test-only credentials of the service containers above.
      WEBAPPFORGE_SQLSERVER: "Server=127.0.0.1,1433;User ID=sa;Password=Forge-Test-42!;TrustServerCertificate=True;Encrypt=False"
      WEBAPPFORGE_MYSQL: "Server=127.0.0.1;Port=3306;User ID=root;Password=forge-test-42"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      # The Northwind tests skip with a message when the sample cannot be downloaded.
      - name: Download the Northwind sample
        continue-on-error: true
        run: |
          curl -fsSL https://raw.githubusercontent.com/jpwhite3/northwind-SQLite3/HEAD/dist/northwind.db -o "$RUNNER_TEMP/northwind.db"
          echo "WEBAPPFORGE_NORTHWIND_DB=$RUNNER_TEMP/northwind.db" >> "$GITHUB_ENV"

      - name: Build
        run: |
          for project in src/WebAppForge.Core src/WebAppForge.Desktop tests/WebAppForge.Core.Tests tests/WebAppForge.Desktop.Tests tests/ui/tools/harness; do
            dotnet build "$project" -warnaserror
          done

      - name: Core tests
        run: dotnet test tests/WebAppForge.Core.Tests --no-build --logger "console;verbosity=normal"

      - name: Desktop tests
        run: dotnet test tests/WebAppForge.Desktop.Tests --no-build --logger "console;verbosity=normal"
